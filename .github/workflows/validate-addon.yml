name: Validate Addon

on:
  pull_request:
  push:
    branches:
      - "**"

jobs:
  validate-addon:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate plugin.cfg semver
        run: |
          version="$(sed -n 's/^version="\(.*\)"$/\1/p' addons/godotdev_nvim_node_copy/plugin.cfg)"
          if [ -z "$version" ]; then
            echo "Could not read version from plugin.cfg" >&2
            exit 1
          fi

          case "$version" in
            [0-9]*.[0-9]*.[0-9]*)
              ;;
            *)
              echo "plugin.cfg version '$version' is not valid semver" >&2
              exit 1
              ;;
          esac

      - name: Build release payload layout
        run: |
          mkdir -p dist/addons
          cp -R addons/godotdev_nvim_node_copy dist/addons/
          test -f dist/addons/godotdev_nvim_node_copy/plugin.cfg
          test -f dist/addons/godotdev_nvim_node_copy/plugin.gd
          test -f dist/addons/godotdev_nvim_node_copy/README.md
          cd dist
          zip -r addon.zip addons

