name: Release Addon

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version, for example 0.3.3
        required: true
        type: string

permissions:
  contents: write

jobs:
  release-addon:
    runs-on: ubuntu-latest

    steps:
      - name: Validate version input
        id: release
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="${INPUT_VERSION}"
          if [ -z "$version" ]; then
            echo "No version was provided." >&2
            exit 1
          fi

          case "$version" in
            [0-9]*.[0-9]*.[0-9]*)
              ;;
            *)
              echo "Version must look like 0.3.3" >&2
              exit 1
              ;;
          esac

          tag="v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Check out default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Ensure tag does not already exist
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists." >&2
            exit 1
          fi

      - name: Update plugin.cfg
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          perl -0pi -e 's/version="[^"]*"/version="$ENV{VERSION}"/' addons/godotdev_nvim_node_copy/plugin.cfg
          actual_version="$(sed -n 's/^version="\(.*\)"$/\1/p' addons/godotdev_nvim_node_copy/plugin.cfg)"
          if [ "$actual_version" != "$VERSION" ]; then
            echo "plugin.cfg version update failed." >&2
            exit 1
          fi

      - name: Commit release bump
        env:
          VERSION: ${{ steps.release.outputs.version }}
          TAG: ${{ steps.release.outputs.tag }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add addons/godotdev_nvim_node_copy/plugin.cfg
          if git diff --cached --quiet; then
            echo "plugin.cfg is already set to $VERSION" >&2
            exit 1
          fi
          git commit -m "chore: release $VERSION"
          git tag "$TAG"
          git push origin "HEAD:$DEFAULT_BRANCH"
          git push origin "$TAG"

      - name: Prepare release payload
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          mkdir -p dist/addons
          cp -R addons/godotdev_nvim_node_copy dist/addons/
          cd dist
          zip -r "godotdev_nvim_node_copy-${VERSION}.zip" addons

      - name: Create or update GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          files: dist/godotdev_nvim_node_copy-${{ steps.release.outputs.version }}.zip
          generate_release_notes: true
