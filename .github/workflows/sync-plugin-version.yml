name: Sync Plugin Version

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to sync into plugin.cfg
        required: true
        type: string

permissions:
  contents: write

jobs:
  sync-plugin-version:
    runs-on: ubuntu-latest

    steps:
      - name: Check out default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Resolve version from release tag
        id: version
        env:
          INPUT_TAG: ${{ inputs.tag }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          tag="${RELEASE_TAG:-$INPUT_TAG}"
          if [ -z "$tag" ]; then
            echo "No release tag was provided." >&2
            exit 1
          fi

          version="${tag#v}"
          if [ -z "$version" ]; then
            echo "Resolved version is empty." >&2
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Update plugin.cfg
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          perl -0pi -e 's/version="[^"]*"/version="$ENV{VERSION}"/' addons/godotdev_nvim_node_copy/plugin.cfg
          grep '^version=' addons/godotdev_nvim_node_copy/plugin.cfg

      - name: Commit version sync
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if git diff --quiet -- addons/godotdev_nvim_node_copy/plugin.cfg; then
            echo "plugin.cfg already matches $VERSION"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add addons/godotdev_nvim_node_copy/plugin.cfg
          git commit -m "chore: sync plugin version to $VERSION"
          git push origin "HEAD:${{ github.event.repository.default_branch }}"
